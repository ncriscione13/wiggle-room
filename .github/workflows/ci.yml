# CI (task 0.8): every push runs the same gate as local `npm run check`;
# pushes to main additionally deploy the built app to GitHub Pages.

name: CI

on:
  push:
  # Fork PRs don't trigger upstream push events; this makes sure every PR
  # shows the gate (a same-repo PR may run twice -- accepted).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache pose model
        uses: actions/cache@v4
        with:
          path: public/models
          key: pose-model-v1
      - run: npm run fetch-models
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache pose model
        uses: actions/cache@v4
        with:
          path: public/models
          key: pose-model-v1
      - run: npm run fetch-models
      - name: Build for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      # v3 rejected 2026-11-25: GitHub now requires the v4 artifact backend.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
